<app-botao (click)="abrirModal()" class="botao-adicionar-conta">
    <img src="icones/carteira.svg" alt="" class="icone-carteira">
    Adicionar conta
</app-botao>

<app-modal [(aberto)]="modalAberto">
  <ng-container modal-cabecalho class="modal-cabecalho">
    <img src="icones/moeda.svg" alt="">
    <h2 class="text-xl">Adicionar Conta</h2>
  </ng-container>

  <form class="form text-md" (ngSubmit)="aoSubmeter()" ngNativeValidate>
    <label class="label-grupo">
      Nome da transação
      <input [(ngModel)]="novaContaForm.nome" class="input" type="text" name="nome-conta">
    </label>

    <label class="label-grupo">
      Saldo
      <input class="input" type="number" [(ngModel)]="novaContaForm.saldoInicial" 
      name="valor-saldo" min="0" step="0.01" placeholder="R$ 500,00" required>
    </label>

    <app-botao class="botao-adicionar-conta">
      Adicionar
    </app-botao>
  </form>
</app-modal>
